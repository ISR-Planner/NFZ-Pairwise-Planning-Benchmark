[project]
name = "NFZ-Pairwise-Planning-Benchmark"
version = "1.0.0"
description = "Multi-drone Mission Mission Planner — FastAPI backend + LangGraph v4 agent system"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["tests/archive", "tests/e2e"]

[tool.mypy]
exclude = ["archive"]
ignore_missing_imports = true
